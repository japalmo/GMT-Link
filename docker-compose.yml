# ─────────────────────────────────────────────────────────────────────────────
#  GMT Link — Docker Compose (entorno local de desarrollo)
#
#  Levanta la infraestructura y un contenedor de la app para ver la web en
#  Docker Desktop y abrirla desde el navegador en http://localhost:5173.
#
#  Comandos:
#    docker compose up -d --build  → levanta en segundo plano y reconstruye
#    docker compose down           → apaga y elimina contenedores
#    docker compose down -v        → apaga y borra también los datos
# ─────────────────────────────────────────────────────────────────────────────

services:

  # Migraciones + seeds de desarrollo antes de levantar la app. Reemplaza al
  # antiguo `firebase-seed`: la auth es propia (JWT + bcrypt) y ya no hay emulador
  # de Firebase. Conserva los pasos que sí tocan Postgres.
  db-init:
    image: gmt-link-app
    container_name: gmt_db_init
    working_dir: /workspace/nodes/backend-central
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://gmt_admin:gmt_dev_2024@postgres:5432/gmt_link
      NODE_ENV: development
    command: >-
      sh -c "pnpm exec prisma migrate deploy &&
      pnpm exec tsx prisma/seed-admin.ts &&
      pnpm exec tsx prisma/seed-auth-dev.ts"
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gmt_app
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openfga:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://gmt_admin:gmt_dev_2024@postgres:5432/gmt_link
      REDIS_URL: redis://redis:6379
      FGA_API_URL: http://openfga:8080
      FGA_STORE_ID: ""
      FGA_MODEL_ID: ""
      PORT: "3001"
      NODE_ENV: development
      CORS_ORIGINS: http://localhost:5173
      API_PUBLIC_URL: http://localhost:3001
      VITE_API_URL: http://localhost:3001
    ports:
      - "3001:3001"
      - "5173:5173"

  postgres:
    image: postgres:16-alpine
    container_name: gmt_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gmt_link
      POSTGRES_USER: gmt_admin
      POSTGRES_PASSWORD: gmt_dev_2024
    # Solo en loopback: la clave de desarrollo no debe quedar expuesta a la red.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmt_admin -d gmt_link"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: gmt_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # OpenFGA — servidor de autorización (§4.3). Almacenamiento in-memory (dev):
  # se resetea al reiniciar, por eso hay que correr `pnpm run fga:bootstrap`
  # (nodes/backend-central) después de levantarlo para recrear el store + authorization model.
  openfga:
    image: openfga/openfga:v1.18.1
    container_name: gmt_openfga
    restart: unless-stopped
    command: run
    ports:
      - "8080:8080" # HTTP API (FGA_API_URL)
      - "8081:8081" # gRPC

volumes:
  postgres_data:
  redis_data:
